[plugin]

name="dot-peer-to-peer"
description="Peer-to-peer sessions: a lobby with join codes and readiness, a signaller interface with loopback and HTTP implementations, a transport reached without ever naming its class so a build without the extension still compiles, deterministic host migration, and an explicit trust model because a host who is a player can cheat. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_peer_to_peer_plugin.gd"
